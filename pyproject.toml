[project]
name = "diffusive"
version = "0.1.0"
description = "Headless ComfyUI Python Video & Image Editing Workspace"
requires-python = "==3.12.*"
dependencies = [
    "comfyui==0.41.0.1",
    "comfyui-to-python-extension==2.1.0",
    "torch==2.14.1+cu132",
    "torchvision==0.29.1+cu132",
    "playwright>=1.64.0",
    "black>=26.10.1",
    "opencv-contrib-python-headless>=4.12.0.88,<5",
    "numpy>=1.25.0,<2.3",
    "pillow",
    "tqdm",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "appmana"
url = "https://nodes.appmana.com/simple/"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
comfyui = { path = "packages/comfyui", editable = true }
comfyui-to-python-extension = { path = "packages/comfyui-to-python", editable = true }
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }
triton = { index = "pypi" }
