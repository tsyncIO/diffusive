[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui"
version = "0.41.0.1"
description = "Vendored static ComfyUI core package for Diffusive"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.25.0",
    "aio-pika<10,>=7.2",
    "aiofiles>=23.1.0",
    "aiohttp>=3.13.2",
    "alembic",
    "anthropic",
    "av>=17.0.0",
    "basedpyright",
    "blake3",
    "can-ada",
    "certifi",
    "clean-fid>=0.1.35",
    "click",
    "colour",
    "comfy-aimdo==0.5.6",
    "comfy-angle",
    "comfy-kitchen==0.2.37",
    "comfyui-embedded-docs==0.5.14",
    "comfyui-frontend-package==1.55.17",
    "comfyui-manager<5,>=4.2.2",
    "comfyui-workflow-templates==0.11.86",
    "configargparse>=1.7.1",
    "cryptography",
    "diffusers>=0.30.1",
    "einops>=0.6.0",
    "email-validator",
    "filelock",
    "frozendict>=2.3.6",
    "fsspec",
    "gguf",
    "glfw",
    "google-generativeai",
    "huggingface-hub[hf-xet]>=0.32.0",
    "humanize",
    "ijson",
    "importlib-resources",
    "jax",
    "jaxtyping",
    "joblib",
    "jsonmerge>=1.9.0",
    "kornia>=0.7.1",
    "lazy-loader>=0.3",
    "lazy-object-proxy",
    "matrix-nio",
    "ml-dtypes",
    "mpmath<1.4,>=1.1.0",
    "natsort",
    "networkx>=2.6.3",
    "numpy<2.3,>=1.25.0",
    "open-clip-torch>=2.24.0",
    "openai",
    "opencv-contrib-python-headless<5,>=4.12.0.88",
    "openexr",
    "opentelemetry-distro>=0.50b0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-aio-pika>=0.50b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.50b0",
    "opentelemetry-instrumentation-aiohttp-server>=0.50b0",
    "opentelemetry-instrumentation-asyncio>=0.50b0",
    "opentelemetry-instrumentation-requests>=0.50b0",
    "opentelemetry-instrumentation-urllib3>=0.50b0",
    "opentelemetry-instrumentation>=0.50b0",
    "opentelemetry-processor-baggage>=0.50b0",
    "opentelemetry-propagator-jaeger>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-semantic-conventions>=0.50b0",
    "opentelemetry-util-http>=0.50b0",
    "pebble>=5.0.7",
    "peft>=0.10.0",
    "pillow",
    "propcache>=0.4.1",
    "protobuf>=3.20.0",
    "psutil",
    "pydantic-ai-slim[anthropic,google,openai]>=0.0.36",
    "pydantic-settings~=2.0",
    "pydantic~=2.0",
    "pyjwt[crypto]",
    "pyopengl>=3.1.8",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0",
    "questionary",
    "requests-cache",
    "requests<2.34",
    "resize-right>=0.0.2",
    "rich",
    "s3fs",
    "safetensors>=0.4.2",
    "scikit-image>=0.20.0",
    "scikit-learn>=1.4.1",
    "scipy>=1.11.4",
    "sentencepiece",
    "setuptools",
    "simpleeval>=1.0.3",
    "skia-python",
    "soundfile>=0.13",
    "spandrel-extra-arches",
    "spandrel>=0.3.4",
    "sqlalchemy<2.1,>=2.0",
    "tokenizers>=0.13.3",
    "torch",
    "torchdiffeq>=0.2.3",
    "torchinfo",
    "torchsde>=0.2.6",
    "torchvision",
    "tqdm",
    "transformers>=4.57.3",
    "trimesh",
    "typer>=0.25.1",
    "universal-pathlib",
    "vtracer<1.0.0a0,>=0.6.15",
    "watchdog",
    "webcolors",
    "wrapt>=1.16.0",
    "yarl>=1.22.0",
    "yt-dlp",
]

[project.scripts]
comfyui = "comfy.cmd.cli:entrypoint"
comfyui-worker = "comfy.entrypoints.worker:entrypoint"
comfyui-workflow = "comfy.entrypoints.workflow:entrypoint"

[project.entry-points."fsspec.specs"]
civitai = "comfy.component_model.civitai_fsspec:CivitaiFileSystem"
civitai-red = "comfy.component_model.civitai_fsspec:CivitaiRedFileSystem"
pkg = "comfy.component_model.package_filesystem:PkgResourcesFileSystem"
youtube = "comfy.component_model.youtube_fsspec:YouTubeFileSystem"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "comfy*",
]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.sql", "*.ini", "*.mako", "*.txt", "*.md", "*.typed"]
